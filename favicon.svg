<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="forgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="100%" stop-color="#121520" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Shape Background -->
  <polygon points="50,6 90,22 90,60 50,94 10,60 10,22" fill="url(#metalGrad)" stroke="url(#forgeGlow)" stroke-width="3" />
  
  <!-- Glowing Flame -->
  <path d="M 50 78 C 35 78 32 60 42 46 C 45 42 49 34 50 24 C 52 34 60 42 60 52 C 60 62 65 66 60 72 C 57 78 54 78 50 78 Z" fill="url(#forgeGlow)" filter="url(#glow)" />
  
  <!-- Anvil -->
  <path d="M 26 56 H 74 L 68 63 H 58 L 62 74 H 38 L 42 63 H 32 Z" fill="#0c0e14" stroke="#ffb703" stroke-width="1.5" />

  <!-- Sparks -->
  <circle cx="50" cy="22" r="2.5" fill="#ffe600" />
  <circle cx="34" cy="34" r="2" fill="#ffb703" />
  <circle cx="66" cy="34" r="2" fill="#ffb703" />
</svg>
